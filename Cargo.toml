[workspace]
resolver = "2"
members = ["crates/monty-go-ffi"]
exclude = ["third_party"]

[workspace.package]
edition = "2024"
version = "0.0.14"
rust-version = "1.96"
license = "MIT"
authors = ["Eric Hauser"]
categories = ["compilers", "emulators", "development-tools"]
keywords = ["python", "interpreter", "sandbox", "embedded", "go"]
homepage = "https://github.com/pluralsh/gomonty"
repository = "https://github.com/pluralsh/gomonty"
documentation = "https://github.com/pluralsh/gomonty"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.dependencies]
# Upstream Monty pin (tag 1.4.0). Keep every rev value aligned when bumping.
monty = { git = "https://github.com/pydantic/monty.git", rev = "4b015dc4a1e08394b0a98e0255ed8c81de1fbbf6" }
monty-types = { git = "https://github.com/pydantic/monty.git", rev = "4b015dc4a1e08394b0a98e0255ed8c81de1fbbf6" }
monty-fs = { git = "https://github.com/pydantic/monty.git", rev = "4b015dc4a1e08394b0a98e0255ed8c81de1fbbf6" }
monty-alloc = { git = "https://github.com/pydantic/monty.git", rev = "4b015dc4a1e08394b0a98e0255ed8c81de1fbbf6" }
monty-type-checking = { git = "https://github.com/pydantic/monty.git", rev = "4b015dc4a1e08394b0a98e0255ed8c81de1fbbf6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
serde_bytes = "0.11"
minicbor-serde = { version = "0.7", default-features = false, features = ["alloc"] }
num-bigint = { version = "0.4", features = ["serde"] }
pretty_assertions = "1.4"

# Upstream ruff_db/ty_vendored 0.0.14 and monty-typeshed 1.4.0 depend on zip
# 0.6/8.x, which are affected by GHSA zip cloaking (fixed in zip 9.0.5). These
# vendored copies only bump zip to 9.x (see third_party/README.md). Remove once
# upstream Monty ships with zip >= 9.0.5.
[patch.crates-io]
ruff_db = { path = "third_party/ruff_db" }
ty_vendored = { path = "third_party/ty_vendored" }

[patch."https://github.com/pydantic/monty.git"]
monty-typeshed = { path = "third_party/monty-typeshed" }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(codspeed)'] }

[workspace.lints.rustdoc]
invalid_codeblock_attributes = "allow"

[workspace.lints.clippy]
dbg_macro = "warn"
use_self = "warn"
allow_attributes = "warn"
undocumented_unsafe_blocks = "warn"
redundant_clone = "warn"
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
too_many_lines = "allow"
