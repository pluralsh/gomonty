[package]
name = "monty-typeshed"
version = "1.4.0"
edition = "2024"
license = "MIT"

[lib]
name = "monty_typeshed"
path = "src/lib.rs"

[dependencies]
ruff_db = { version = "0.0.14", features = ["serde"] }
zip = { version = "9.0.5", default-features = false }

[build-dependencies]
path-slash = "0.2.1"
walkdir = "2.3.2"
zip = { version = "9.0.5", features = ["zstd", "deflate"] }

[features]
zstd = ["zip/zstd"]
deflate = ["zip/deflate"]
